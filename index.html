
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SE Lab Experiment</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            text-align: center;
            padding: 50px 70px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #5b3cc4;
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>SE Lab Experiment</h1>
        <p>Welcome to the Software Engineering Lab</p>
    </div>
</body>
</html>
